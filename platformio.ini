[platformio]
default_envs = teensy32_control

[env]
platform = teensy
board = teensy31
framework = arduino

[env:teensy32_control]
build_flags = -DFIRMWARE_CAN_DEBUG=0 -DFIRMWARE_TIMING_DIAGNOSTICS=0
build_src_filter = +<*.cpp> -<can_debug.cpp> -<timing_diagnostics.cpp>

[env:teensy32_debug]
build_flags = -DFIRMWARE_CAN_DEBUG=1 -DFIRMWARE_TIMING_DIAGNOSTICS=0
build_src_filter = +<*.cpp> -<timing_diagnostics.cpp>

[env:teensy32_timing]
build_flags = -DFIRMWARE_CAN_DEBUG=0 -DFIRMWARE_TIMING_DIAGNOSTICS=1
build_src_filter = +<*.cpp> -<can_debug.cpp>

[env:teensy32_debug_timing]
build_flags = -DFIRMWARE_CAN_DEBUG=1 -DFIRMWARE_TIMING_DIAGNOSTICS=1
build_src_filter = +<*.cpp>
